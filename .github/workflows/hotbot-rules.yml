name: HotBot automated checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-source:
    name: Python syntax and version checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate entire codebase Python syntax
        run: python -m compileall -q hotbot.py cogs core
      - name: Validate changed Python files and versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          if [[ "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-parse "$CURRENT_SHA^" 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          python - "$BASE" "$CURRENT_SHA" <<'PY'
          import ast
          import re
          import subprocess
          import sys

          base, head = sys.argv[1:]

          def git(*args, missing_ok=False):
              result = subprocess.run(["git", *args], capture_output=True, text=True)
              if result.returncode:
                  if missing_ok:
                      return None
                  raise RuntimeError(result.stderr.strip())
              return result.stdout

          def version(source):
              for node in ast.parse(source).body:
                  value = None
                  if isinstance(node, ast.Assign) and any(
                      isinstance(target, ast.Name) and target.id == "__version__"
                      for target in node.targets
                  ):
                      value = node.value
                  elif isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == "__version__":
                      value = node.value
                  if isinstance(value, ast.Constant) and isinstance(value.value, str):
                      return value.value
              return None

          def parse_version(value):
              if not re.fullmatch(r"[0-9]+(?:\.[0-9]+)*", value):
                  raise ValueError(f"Invalid __version__: {value}")
              return tuple(map(int, value.split(".")))

          changed = git("diff", "--name-only", "--diff-filter=ACMR", base, head).splitlines()
          errors = []
          checked = 0
          for path in changed:
              if not path.endswith(".py"):
                  continue
              checked += 1
              source = git("show", f"{head}:{path}")
              if source.splitlines()[:1] != [f"# {path}"]:
                  errors.append(f"{path}: first line must be '# {path}'")
              try:
                  compile(source, path, "exec")
                  new = version(source)
                  old_source = git("show", f"{base}:{path}", missing_ok=True)
                  old = version(old_source) if old_source is not None else None
                  runtime = path == "hotbot.py" or path.startswith(("cogs/", "core/"))
                  if path.endswith("/__init__.py"):
                      runtime = False
                  if (runtime or old is not None) and new is None:
                      errors.append(f"{path}: missing __version__")
                  if new is not None:
                      current = parse_version(new)
                      if old is not None and current <= parse_version(old):
                          errors.append(f"{path}: bump __version__ ({old} -> {new})")
              except (SyntaxError, ValueError) as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              for error in errors:
                  print("FAIL:", error)
              sys.exit(1)
          print(f"PASS: {checked} changed Python files validated")
          PY

  regression-tests:
    name: Run tests when available
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run existing tests automatically
        shell: bash
        run: |
          if [[ -d tests ]]; then
            python -m unittest discover -s tests -v
          else
            echo "No tests directory; skipped (not a failure)."
          fi
